[project]
name = "lup-template"
version = "0.2.0"
description = "Self-improving agent template with feedback loop, built with the Claude Agent SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Joy Void Joy", email = "joy.void.joy@gmail.com" }]
keywords = [
    "agent",
    "ai",
    "claude",
    "feedback-loop",
    "llm",
    "self-improving",
    "template",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "lup-agents[claude,codex,conversation,docker,web]",
    "packaging>=26.2",
    "prompt-toolkit>=3.0.52",
    "pydantic-settings>=2.12.0",
    "sh>=2.4.0",
    "tomlkit>=0.15.0",
    "typer>=0.21.1",
    "tzlocal>=5.4.3",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
lup = "lup_template.environment.cli.__main__:app"
lup-devtools = "lup.devtools.entrypoint:main"

[project.entry-points."lup.devtools"]
application = "lup_template.devtools.main:app"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "python-xlib>=0.33",
    "pyyaml>=6.0.3",
    "ruff>=0.14.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# A passage is prose beside the module declaring it, so every package ships
# its Markdown: a wheel without it holds declarations and no words.
"*" = ["*.md"]
"lup_template.devtools.dashboard" = ["assets/*.html"]
"lup_template.harness.content" = ["assets/*.js", "assets/*.sh"]

[tool.lup]
agent_version = "0.2.0"
# This repository is the scaffold itself, so its `# lup: template:` markers are
# inventory rather than outstanding work. `dev init` clears this when a domain
# adopts the template, and from then on `dev check` lists every marker still
# standing. Never set it in a repository built from this one.
template = true

[tool.uv]
exclude-newer = "3 days"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
lup-agents = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "packages/lup/src"]
addopts = "-m 'not integration'"
markers = ["integration: tests requiring external services (Docker, APIs)"]

[tool.pyright]
# Workspace-wide check, run from the repo root: the template (src), the
# vendored lup library (packages/lup/src), tests, the runnable examples that
# document composition, and the generated plugin hook trees. Pyright reads
# only this root config when invoked here — it does not discover the member
# config in packages/lup/pyproject.toml — so every include the workspace
# needs is listed.
include = [
    "src",
    "packages/lup/src",
    "tests",
    "packages/lup/tests",
    "examples",
    ".claude/plugins/lup/hooks",
    ".codex/plugins/lup/hooks",
]
pythonVersion = "3.14"

# `kernel`, `policy_data`, and `codex_patch` are top-level modules only inside
# a generated plugin's `hooks/runtime`. Naming that directory as the search
# path checks each dispatcher — the canonical asset and the script compiled
# from it — against the exact runtime it is shipped beside. `host` is the half
# the compiler links in rather than ships, so an asset resolves it against the
# canonical module both scripts are compiled from.
[[tool.pyright.executionEnvironments]]
# The kernel-aware shared half calls the kernel and is spliced into every
# generated script, so it reads against a generated runtime for the same
# reason an adapter half does. Both trees are named because neither runtime
# owns this half: they carry the same kernel and the same policy_data names,
# so either resolves it, and naming only one would leave a workspace that has
# generated the other unable to check the file at all.
root = "packages/lup/src/lup/policy/assets"
extraPaths = [
    ".claude/plugins/lup/hooks/runtime",
    ".codex/plugins/lup/hooks/runtime",
]

[[tool.pyright.executionEnvironments]]
root = "packages/lup/src/lup/providers/assets"
extraPaths = [".claude/plugins/lup/hooks/runtime", ".codex/plugins/lup/hooks/runtime"]

[[tool.pyright.executionEnvironments]]
root = "packages/lup/src/lup/providers/claude/assets"
extraPaths = [
    ".claude/plugins/lup/hooks/runtime",
    "packages/lup/src/lup/policy/assets",
]

[[tool.pyright.executionEnvironments]]
root = ".claude/plugins/lup/hooks/scripts"
extraPaths = [".claude/plugins/lup/hooks/runtime"]

[[tool.pyright.executionEnvironments]]
root = "packages/lup/src/lup/providers/codex/assets"
extraPaths = [
    ".codex/plugins/lup/hooks/runtime",
    "packages/lup/src/lup/policy/assets",
]

[[tool.pyright.executionEnvironments]]
root = ".codex/plugins/lup/hooks/scripts"
extraPaths = [".codex/plugins/lup/hooks/runtime"]

[tool.ruff]
# Pinned below requires-python (>=3.14) so ruff keeps `except (A, B):`
# parenthesized. Inferring py314 would treat the parens as redundant and
# strip them, since `except A, B:` is valid syntax from 3.14 on.
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
# A dispatcher half is compiled, not imported: only its import block is
# emitted into the generated script, so it must carry every module the shared
# host half stands on. `lup.policy.dispatcher` proves that carry and fails
# generation when one is missing — an import unused in this file alone is the
# requirement being met, not a leftover.
"packages/lup/src/lup/providers/*/assets/policy_dispatcher.py" = ["F401"]
