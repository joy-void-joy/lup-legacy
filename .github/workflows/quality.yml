# Generated from lup.devtools.dev.workflow by `uv run lup-devtools harness generate all` — edit the source, not this file.
# See docs/harness.md.

name: Quality

'on':
  pull_request:
  push:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: packages/lup/web
      - run: uv sync --all-extras
      - name: Merge driver
        run: uv run lup-devtools git merge-driver
      - name: Generated artifact drift
        run: uv run lup-devtools harness check all
      # GitHub's ubuntu-24.04 image restricts unprivileged user namespaces
      # through AppArmor, leaving one no capabilities, so the tests that
      # mount inside one skip rather than run. Lifted for this throwaway runner.
      - name: Unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Quality gate
        run: uv run lup-devtools dev check
