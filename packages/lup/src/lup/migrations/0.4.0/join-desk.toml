subjects = ["JoinDesk", "JoinDesk.__init__"]
reason = """
Concurrent resolver joins require concern-owned checkpoint directories."""
commit = "ddbbb021ec4b7fb28208f34763b8324cfc818bcc"

[[steps]]
instruction = """
Construct JoinDesk(run_dir, concern_id). With the run stopped, move any \
join/plan.json and join/progress.json into join/<concern_id>/, using the \
identity recorded in the plan. Dependency checkpoints no longer populate the \
integration-only ResolveState.join_progress field."""
