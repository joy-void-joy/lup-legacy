    "ClaudeProfileStore.resolver_registry",
    "ClaudeProfileStore.resolve_config_dir",
    "ClaudeProfileStore.names",
    "ClaudeProfileStore.config_dir_for",
    "ClaudeProfileStore.active_profile",
    "ClaudeProfileStore.add_profile",
    "ClaudeProfileStore.set_active",
    "ClaudeProfileStore.remove_profile",
]
reason = """
personal Claude profile storage, reading names, and curating accounts are \
separate collaborators; the registry file format is unchanged"""
commit = "fcb61ade64fe36d224b0889eebb1e097ffa954cf"

[[steps]]
instruction = """
Import AccountFile, ClaudeProfileNames, and ClaudeProfileRegistrar from \
lup.providers.claude.profile_store. Construct accounts = \
AccountFile(registry_path), then pass the same accounts to \
ClaudeProfileNames(accounts) and ClaudeProfileRegistrar(accounts). Keep \
homes_root, load_registry, save_registry, resolver_registry, and \
resolve_config_dir calls on accounts; call names, config_dir_for, and \
active_profile on the names reader; call add_profile, set_active, and \
remove_profile on the registrar."""

[[steps]]
instruction = """
For CLI profile selection, compose ProfileDirectory(names, registrar, \
CLAUDE_LOGIN) from lup.providers.profiles and lup.providers.claude.login. \
Preserve the existing registry path and account homes; no credential or data \
migration is needed."""
