[[steps]]
instruction = """
Remove approval-memory lookups from policy adapters. Keep explicit reusable \
grants in their declared policy scope; historical approvals.jsonl records \
have no such receipt and grant no authority. note_ran records observed \
execution only."""

[[steps]]
instruction = """
Regenerate both plugins. For unresolved native asks, inspect the named review \
with dev questions show and answer or reject it from an operator terminal. A \
