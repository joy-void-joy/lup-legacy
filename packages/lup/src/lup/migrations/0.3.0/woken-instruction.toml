instruction = """
Drop the field from anything that read it. A wake now either reached the peer \
or did not: read `reached` for which, and `reason` for why not. Code that \
printed `instruction` beside `note` should print `note` alone, and code that \
branched on `instruction` being set has one branch fewer."""
