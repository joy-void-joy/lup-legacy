[[steps]]
instruction = """
`close_claim_window(root, store, windows_dir, mine)` answers `{\"paths\": \
[...]}` and takes no `stale_after_seconds`: it no longer reads anybody else's \
window, so `stale_window` has nothing to judge. `store.record_claims(root, \
mine, paths)` takes the three arguments that are left."""
