commit = "571311dac058cf7136238ea4c6a18de89cdb9a2f"

[[steps]]
instruction = """
A caller constructing or reading an `AntiPattern` changes nothing: the fields \
are inherited. One that read `STRUCTURAL_RULES` or `anti_pattern_rules()` \
reads `all_rules()`, which derives every card. A project declaring a rule the \
sweep decides declares a `ProjectRule` from `lup.harness.codescan.project` \
beside its audit and adds it to its set's `project` list."""
