    "RecordedReply",
]
reason = """
the review relay keeps each question once: `.lup/questions.jsonl` opens with \
a `{"relay": 2}` line, holds one record per question as it was parked -- each \
document it binds (a preimage, a verdict's after-document) kept once in \
`.lup/reviews/blobs/<sha256>` and named in the record by digest -- and a \
small transition per state it moves to since, never a full copy; settled \
reviews older than the retention window move to `.lup/reviews/archive.jsonl` \
without their documents. A relay's readers fold the log to RecordedQuestion, \
which names documents by digest, and read one back whole as \
PersistentQuestion where they need its documents or its fingerprint"""

[[steps]]
instruction = """
Nothing to run for the log itself: the first relay open under the relay's lock \
-- a hook, `review list`, `review wait`, the dashboard -- rewrites an older \
full-copy `.lup/questions.jsonl` into the new shape (its documents extracted \
into `.lup/reviews/blobs`, each question's copies collapsed into the state it \
came to), and nothing reads the older shape after. Every checkout of a \
repository takes the new format when it takes this version: a checkout still \
on older code writes the older shape, which a newer reader of its relay \
rewrites, so update every checkout a dashboard serves together. The host's \
answers store ($XDG_STATE_HOME/lup/reviews) is untouched, and fingerprints are \
unchanged, so an answer recorded before still settles its review."""

[[steps]]
instruction = """
Where QuestionRelay.questions(), find() or pending() was read for a question's \
documents -- `question.preconditions` as text, a file review's `after`, \
`bound()`, `native_fingerprint()`, or a preview through \
`lup.devtools.review.propose.previewed` -- read it back first with \
`relay.resolve(question)` (or `relay.question(id)`), which returns the \
PersistentQuestion those need and raises ValueError where a document is \
missing or altered. What they return otherwise is a RecordedQuestion: \
`preconditions` maps each path to a StoredDocument (its `sha256`) or None, and \
each `file_reviews` row is a RecordedFileReview whose `after` is a \
StoredDocument. QuestionRelay.record still takes a PersistentQuestion; \
`PersistentQuestion.recorded()` gives the form the relay folds it to."""
command = ["uv", "run", "lup-devtools", "dev", "py", "text", ".preconditions", "."]

[[steps]]
instruction = """
Import Remark, RecordedRemark, Reply and RecordedReply from lup.policy.relay \
where they were imported from lup.devtools.review.thread; build a ReviewThread \
from the relay (`ReviewThread.of(relay)`), which folds replies and remarks \
incrementally rather than rereading both files."""
command = ["uv", "run", "lup-devtools", "dev", "py", "text", "review.thread import", "."]

[[steps]]
instruction = """
Pass the relay to lup.devtools.dashboard.reviews.ReviewQueue.read(root, relay); \
read a ReviewStore's rows through snapshot() -- every waiting review and the \
most recently settled, with `history` counting all -- and history(offset, \
limit) for older ones, where read_root(root) was read. \
lup.devtools.review.preimages.moved_preimage(path, recorded) takes the \
StoredDocument a review names the preimage by, and compares the file's \
digest to it."""

[[steps]]
instruction = """
A settled review (completed, failed, in_doubt, rejected, cancelled, expired or \
stale) keeps its documents for `review-retention-days` under `[tool.lup]` in \
the checkout's pyproject.toml, seven by default, before the dashboard's sweep \
or `review list` moves it to the archive; set it where a project wants \
another window."""
