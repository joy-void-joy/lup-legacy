subjects = ["repaired_directives", "file_diagnostics"]
reason = """
the checks after a write report what still refuses apart from what is only \
worth knowing, so the sweep answers for every file a call wrote at once and \
the type check says which of its findings a later edit may still supply"""

[[steps]]
instruction = """
Call swept_files(paths, command) in place of repaired_directives(path, \
command): it takes every path to sweep and returns, per path, a mapping with \
"written" (the text before the sweep), "repaired" (the lines \
repaired_directives returned) and "refused" (what the sweep still refuses)."""

[[steps]]
instruction = """
Read file_diagnostics(path, command) as a mapping: "blocking" holds the lines \
it returned before, and "context" the names used before an edit supplies \
them, headed by one line saying so."""
