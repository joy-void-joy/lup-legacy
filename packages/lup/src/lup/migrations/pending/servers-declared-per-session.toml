reason = """
a runtime reading a strict MCP roster drops a plugin's own servers, so the \
servers a session carries are declared per session by its launch — \
--mcp-config on Claude Code, --config mcp_servers.* on Codex, the SDK's own \
servers for a session opened in process — and the generated plugin carries \
skills, agents and hooks alone"""

[[steps]]
instruction = """
Declare the servers a Plugin listed as ToolServers from lup.mcp in the agent's \
tools.mcp — Coordination(), Ledger(...), CodeIntel(), Toolset(...), \
Group(builder=...), or External(name=..., server=...) for a transport lup \
does not host — and give the launch's ServeLaunch(program=..., session=..., \
needs=..., startup_timeout_seconds=...) as tools.serve; a harness that \
launches from a composition declares them on ProjectContent(servers=..., \
serve=...)."""

[[steps]]
instruction = """
Grant a server's tools by the key it is declared under, mcp__<server>, where a \
grant or matcher named plugin_served_tool(plugin, server); \
lup.devtools.harness.settings.project_settings(declared, plugin, servers) and \
served_tool_grants(servers) take the servers."""

[[steps]]
instruction = """
Read a launch's MCP_TIMEOUT from claude_server_environment(tools) and each \
Codex server's startup_timeout_sec from codex_mcp_arguments(tools), both in \
lup.providers.<runtime>.launch, where startup_deadline_settings rendered one \
into the settings artifact."""
