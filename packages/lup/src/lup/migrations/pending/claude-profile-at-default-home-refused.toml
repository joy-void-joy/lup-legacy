subjects = [
    "ClaudeProfileSelection",
    "ClaudeProfileRegistrar",
    "ProfileDirectory",
]
reason = """
a named Claude profile whose home is ~/.claude pointed each session at that \
home by name, which makes Claude Code read ~/.claude/.claude.json rather than \
the ~/.claude.json a plain `claude` reads, so its sessions opened as if the \
account were new; a profile naming the default home is refused wherever one \
is registered, selected or resolved, and a typed selection cannot hold one"""
commit = "50350cd41785bf898d238bd98cb32ae556867aa5"

[[steps]]
instruction = """
Leave the profile unset to use the default account: forget a profile \
registered at ~/.claude with `harness profile remove <name>`, and pass \
config_directory=None rather than the default home to ClaudeProfileSelection. \
Each refusal raises DefaultHomeProfile from lup.providers.profiles, a \
ValueError."""
