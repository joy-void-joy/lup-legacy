subjects = ["changed_python_files"]
reason = """
`dev check --changed` names every changed file a scoped check does not read, \
where it used to drop them, so the scope it reads is one answer holding both \
halves"""
commit = "36f0c9811af9eb7704a9d41ff60185e4b6d8ca92"

[[steps]]
instruction = """
Call changed_scope(since).checked from lup.devtools.dev.check where \
changed_python_files(since) was called; changed_scope(since).unread holds the \
other changed files."""
