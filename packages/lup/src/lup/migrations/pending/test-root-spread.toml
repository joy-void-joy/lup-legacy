subjects = ["parallel_arguments"]
reason = """
a suite spreads over processes where its own environment holds pytest-xdist, \
asked of the environment `uv run` builds from the suite's directory, or where \
its TestRoot declares `parallel`; the gate's own interpreter answered for \
every suite, and handed `-n` to a nested project's pytest that refused it"""

[[steps]]
instruction = """
Replace calls to lup.devtools.dev.check.parallel_arguments(workers) with \
