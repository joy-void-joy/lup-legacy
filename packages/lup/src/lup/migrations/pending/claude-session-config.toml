reason = """
the declaration and the agent it opened were two objects saying one thing; \
Claude is both, so every field and validator of the config lives on it"""
commit = "eca60905d6e5e77d9e365f97345bd7553abe719f"

[[steps]]
instruction = """
Construct Claude(...), from lup or lup.providers.claude, wherever \
ClaudeSessionConfig(...) was built: every field keeps its name and type, and \
model_id(), the_model_takes_its_effort and enforce_native_authority move with \
them."""

[[steps]]
instruction = """
Read an unset effort as the model's default rather than the CLI's: xhigh \
where the model's catalog row takes it, the row's highest rung below xhigh \
otherwise, and none for a model taking no effort; resolved_effort() answers \
which rung a session starts at. Pass effort=... where a session should think \
at another."""
