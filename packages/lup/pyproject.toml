[project]
name = "lup-agents"
version = "0.4.0"
description = "Agent development library for Claude and Codex agent SDKs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Joy Void Joy", email = "joy.void.joy@gmail.com" }]
keywords = ["agent", "ai", "claude", "llm", "mcp", "sdk", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "mcp>=2.1.1,<3",
    "packaging>=26.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "pyyaml>=6.0.3",
    "rich>=14.3.1",
    "ruamel-yaml>=0.18",
    "semver>=3.0.4",
    "sh>=2.2.2",
    "tenacity>=9.0.0",
    "tomlkit>=0.15.0",
    "tqdm>=4.70.0",
    "typer>=0.21.1",
    "tzlocal>=5.4.3",
]

[project.optional-dependencies]
claude = [
    "claude-agent-sdk>=0.2.140",
]
codex = []
docker = ["docker>=7.1.0"]
web = [
    "basedpyright>=1.40.1",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.49.0",
]
conversation = [
    "playwright>=1.62.0",
]

# Where the source lives, which is also what a project resolving a release or
# keeping a vendored copy reads as lup's repository when its sync registration
# names none (`lup.devtools.sync.distribution_repository`).
[project.urls]
Repository = "https://github.com/joy-void-joy/lup"

[project.scripts]
lup-codex-plugin = "lup.providers.codex.install:app"
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# A passage is prose beside the module declaring it, so every package ships
# its Markdown: a wheel without it holds declarations and no words.
"*" = ["*.md"]
# The migration record is read from the installed library by an updating
# project, so every release's declarations and the pending ones ship with it.
lup = ["py.typed", "migrations/*/*.toml"]
"lup.providers.claude" = ["assets/*.py"]
"lup.providers.codex" = ["assets/*.py"]
"lup.policy" = ["assets/*.py"]
"lup.devtools.dev" = ["*.css"]
"lup.web" = ["bundles/.lup-ownership.json", "bundles/*/*", "bundles/*/assets/*"]

# Independent of the workspace-root selection, and deliberately so: run from
# this directory the suite sees `src` alone, so a library test that reached
# for the application would fail here while still passing at the root. That
# is the whole reason the two suites are separate rather than one selection.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-m 'not integration'"
markers = ["integration: tests requiring external services (Docker, APIs)"]

[tool.pyright]
# Independent of the workspace-root config: this lets the standalone library
# type-check on its own (pyright run from this directory), where `src` resolves
# to packages/lup/src. The root config re-lists this path under its own include
# for the workspace-wide run; the two configs do not merge or conflict.
include = ["src"]
pythonVersion = "3.14"

# `kernel`, `policy_data`, and `codex_patch` are top-level modules only inside
# a generated plugin's `hooks/runtime`, so each dispatcher asset resolves them
# against the tree the surrounding repository generates — the same layout the
# workspace-root config names, reached from this directory. `host` is the half
# the compiler links in rather than ships, so an asset resolves it against the
# canonical module both scripts are compiled from.
[[tool.pyright.executionEnvironments]]
root = "src/lup/providers/assets"
extraPaths = ["../../.claude/plugins/lup/hooks/runtime", "../../.codex/plugins/lup/hooks/runtime"]

[[tool.pyright.executionEnvironments]]
root = "src/lup/providers/claude/assets"
extraPaths = ["../../.claude/plugins/lup/hooks/runtime", "src/lup/policy/assets"]

[[tool.pyright.executionEnvironments]]
root = "src/lup/providers/codex/assets"
extraPaths = ["../../.codex/plugins/lup/hooks/runtime", "src/lup/policy/assets"]
